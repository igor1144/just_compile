name: Сборка TWRP для HyperOS 2.0 (Докер-Метод)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Запускаем сборку внутри готового контейнера, где 150 ГБ исходников уже лежат внутри!
    container:
      image: ghcr.io/orangefoxrecovery/builder:a12.1

    steps:
    - name: Подготовка окружения
      uses: actions/checkout@v4

    - name: Распаковка дерева устройств из sea.zip
      run: |
        # Внутри докера рабочая папка с готовым Андроидом называется /home/builder/fox_12.1/
        # Создаем там папку под твое дерево
        mkdir -p /home/builder/fox_12.1/device/xiaomi/sea
        
        # Распаковываем твой архив sea.zip, который лежит в корне репозитория
        unzip -o sea.zip -d /tmp/sea_extract
        
        # Переносим файлы конфигурации на свои места
        if [ -d "/tmp/sea_extract/sea" ]; then
          cp -r /tmp/sea_extract/sea/* /home/builder/fox_12.1/device/xiaomi/sea/
        else
          cp -r /tmp/sea_extract/* /home/builder/fox_12.1/device/xiaomi/sea/
        fi

    - name: Мгновенный запуск компиляции vendor_boot
      run: |
        # Переходим в готовую папку с исходниками внутри контейнера
        cd /home/builder/fox_12.1
        
        # Настраиваем окружение (оно тут точно есть!)
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Запуск компиляции
        lunch lineage_sea-eng || lunch twrp_sea-eng
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового образа в GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: /home/builder/fox_12.1/out/target/product/sea/vendor_boot.img
