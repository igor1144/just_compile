name: Build TWRP 14.1 (vendor_boot)

on:
  workflow_dispatch: # Запуск вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest # Теперь смело используем актуальную Ubuntu!
    permissions:
      contents: write

    steps:
    - name: Checkout Private Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Modern Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync Minimal Manifest
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Переключаемся на чистый AOSP манифест, ветка twrp-14.1 (Android 14)
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1 --depth=1
        repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Unpack Device Tree (sea.zip)
      run: |
        if [ -f "sea.zip" ]; then
          echo "Архив sea.zip найден, распаковка в корень исходников..."
          unzip -o sea.zip
          rm sea.zip
        else
          echo "Ошибка: Файл sea.zip не найден в корне вашего репозитория!"
          exit 1
        fi

    - name: Build TWRP Vendor Boot
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # ВНИМАНИЕ: Замените 'device_codename' на кодовое имя вашего устройства из sea.zip
        lunch twrp_device_codename-eng
        
        # Собираем современную цель vendor_bootimage для HyperOS
        mka vendorbootimage -j$(nproc)

    - name: Upload TWRP Vendor Boot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot
        path: out/target/product/*/vendor_boot.img
