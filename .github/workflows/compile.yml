name: Build TWRP for HyperOS 2.0 (Android 14)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в веб-интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-24.04 # Используем свежую версию Ubuntu на сервере

    steps:
      - name: Checkout Workflow Code (Скачиваем ваш репозиторий с sea.zip)
        uses: actions/checkout@v4

      - name: Free Disk Space (Очистка места под исходники)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip

      - name: Install Repo Tool (Исправленный правильный URL)
        run: |
          mkdir -p ~/bin
          curl https://googleapis.com > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Set Git Config
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@build.local"
          git config --global http.postBuffer 1048576000
          git config --global http.maxRequestSize 1048576000

      - name: Repo Init and Sync (Исправленный манифест TWRP)
        run: |
          mkdir twrp
          cd twrp
          # Инициализируем чистый манифест Minimal TWRP для Android 14
          repo init -u https://github.com -b twrp-14.1 --depth=1
          
          # Ограничиваем количество потоков до 4, чтобы избежать банов и HTML-файлов
          repo sync -c -j4 --fail-fast --no-clone-bundle --no-tags

      - name: Unpack Device Tree (Распаковка вашего дерева sea.zip)
        run: |
          # Создаем структуру папок для Xiaomi (устройство sea)
          mkdir -p twrp/device/xiaomi/sea
          
          # Распаковываем ваш архив прямо в созданную папку исходников
          unzip sea.zip -d twrp/device/xiaomi/sea
          
          # Проверяем, что файлы распаковались куда нужно (для логов сборки)
          echo "Содержимое папки дерева устройства:"
          ls -la twrp/device/xiaomi/sea

      - name: Build TWRP Recovery (Xiaomi Sea)
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          
          # Выбираем конфигурацию сборки (обычно twrp_sea-eng или lineage_sea-eng в зависимости от названий файлов в вашем zip)
          lunch twrp_sea-eng || lunch lineage_sea-eng
          
          # Запуск сборки vendor_boot для HyperOS 2.0 / Android 14
          mka vendorbootimage -j$(nproc)

      - name: Upload TWRP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Xiaomi-Sea-VendorBoot
          path: |
            twrp/out/target/product/sea/vendor_boot.img
            twrp/out/target/product/sea/*.zip
