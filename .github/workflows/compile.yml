name: Сборка TWRP для HyperOS 2.0 (Чистый AOSP 12.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Подготовка окружения
      uses: actions/checkout@v4

    - name: Установка необходимых пакетов для сборки Android
      run: |
        sudo apt-get update || true
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip

    - name: Инициализация и загрузка исходников
      run: |
        # Даем права на запуск файлу repo, который лежит прямо в твоем репозитории
        chmod a+x ./repo

        mkdir twrp && cd twrp
        git config --global user.name "Developer"
        git config --global user.email "1144igor@gmail.com"
        
        # Вызываем локальный инструмент напрямую из корня
        ../repo init --depth=1 -u "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" -b twrp-12.1
        ../repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --fail-fast=false

    - name: Клонирование твоего дерева устройств в исходники
      run: |
        mkdir -p twrp/device/xiaomi/sea
        cp -r device/xiaomi/sea/* twrp/device/xiaomi/sea/

    - name: Запуск компиляции vendor_boot
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_sea-eng
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового образа в GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/sea/vendor_boot.img
