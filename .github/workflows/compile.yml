name: Сборка TWRP Vendor Boot Ramdisk (HyperOS 2.0 / Android 15)

on:
  workflow_dispatch: # Запуск вручную через вкладку Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка (Checkout) текущего репозитория
      uses: actions/checkout@v4

    - name: Принудительное исправление DNS (Защита от сбоев сети)
      run: |
        sudo rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

    - name: Максимальная очистка дискового пространства
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap: true

    - name: Установка необходимых системных пакетов (Только 64-бит)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 unzip

    - name: Безопасная установка утилиты Repo (Зеркало GitHub)
      run: |
        rm -rf ~/bin
        mkdir -p ~/bin
        # Скачиваем напрямую проверенный скрипт с GitHub, минуя проблемные сервера Google
        curl -sSL https://githubusercontent.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Синхронизация исходников TWRP (AOSP 15)
      run: |
        mkdir twrp && cd twrp
        git config --global user.name "HyperOS-Builder"
        git config --global user.email "builder@hyperos.internal"
        
        # Инициализация официального минимального манифеста под Android 15
        repo init -u https://github.com -b twrp-15.0
        
        # Синхронизация только нужных веток без истории коммитов (экономит 80% места и времени)
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --depth=1

    - name: Рапасковка дерева устройства из ZIP
      run: |
        VENDOR="xiaomi"
        CODENAME="sea"
        
        TARGET_DIR="twrp/device/${VENDOR}/${CODENAME}"
        mkdir -p $TARGET_DIR
        
        # Распаковываем ваш архив sea.zip из корня репозитория
        unzip -q ./sea.zip -d $TARGET_DIR
        
        # Если файлы внутри архива лежали в подпапке, переносим их в корень TARGET_DIR
        if [ -d "$TARGET_DIR/android_device_${VENDOR}_${CODENAME}" ]; then
            mv $TARGET_DIR/android_device_${VENDOR}_${CODENAME}/* $TARGET_DIR/
            rm -rf $TARGET_DIR/android_device_${VENDOR}_${CODENAME}
        fi
        
        echo "=== Структура дерева устройства ==="
        ls -la $TARGET_DIR

    - name: Запуск компиляции vendor_boot ramdisk
      run: |
        CODENAME="sea"
        
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Автоопределение конфигурации вашего дерева
        lunch twrp_${CODENAME}-eng || lunch omni_${CODENAME}-eng
        
        # Собираем рамдиск и упаковываем его в vendor_boot
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового vendor_boot в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/*/*.img
