name: Сборка TWRP Vendor Boot Ramdisk (HyperOS 2.0 / Android 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка (Checkout) текущего репозитория
      uses: actions/checkout@v4

    - name: Максимальная очистка дискового пространства
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap: true

    - name: Установка необходимых системных пакетов (Только 64-бит)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 unzip

    - name: Локальное создание утилиты Repo без интернета
      run: |
        rm -rf ~/bin
        mkdir -p ~/bin
        
        # Скачиваем стабильный бинарник repo, используя альтернативный официальный домен Google API (не GitHub)
        # Добавляем принудительный IP для обхода сломанного DNS
        curl -sSL --connect-timeout 30 --retry 5 https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        
        # Проверяем, что файл не пустой и не HTML. Если он сломан, создаем заглушку-загрузчик
        if grep -q "<!DOCTYPE html>" /usr/bin/repo || [ ! -s /usr/bin/repo ]; then
          echo "Сеть все еще штормит. Активируем локальный отказоустойчивый метод..."
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://googlesource.com', 'repo.base64')"
          base64 -d repo.base64 > ~/bin/repo
          chmod a+x ~/bin/repo
        fi

    - name: Синхронизация исходников TWRP (AOSP 15)
      run: |
        mkdir twrp && cd twrp
        git config --global user.name "HyperOS-Builder"
        git config --global user.email "builder@hyperos.internal"
        
        # Используем официальный Git-сервер Google для инициализации репозитория (в обход GitHub ресурсов)
        repo init -u https://googlesource.com -b master --depth=1
        
        # Подменяем манифест локально на TWRP 15.0, чтобы repo sync качал именно рекавери
        rm -rf .repo/manifests .repo/manifest.xml
        git clone https://github.com -b twrp-15.0 .repo/manifests --depth=1
        cp .repo/manifests/default.xml .repo/manifest.xml
        
        # Синхронизируем код
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --depth=1

    - name: Распаковка дерева устройства из ZIP
      run: |
        VENDOR="xiaomi"
        CODENAME="sea"
        TARGET_DIR="twrp/device/${VENDOR}/${CODENAME}"
        mkdir -p $TARGET_DIR
        
        unzip -q ./sea.zip -d $TARGET_DIR
        if [ -d "$TARGET_DIR/android_device_${VENDOR}_${CODENAME}" ]; then
            mv $TARGET_DIR/android_device_${VENDOR}_${CODENAME}/* $TARGET_DIR/
            rm -rf $TARGET_DIR/android_device_${VENDOR}_${CODENAME}
        fi
        
        echo "=== Структура дерева устройства ==="
        ls -la $TARGET_DIR

    - name: Запуск компиляции vendor_boot ramdisk
      run: |
        CODENAME="sea"
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        lunch twrp_${CODENAME}-eng || lunch omni_${CODENAME}-eng
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового vendor_boot в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/*/*.img
