name: Build TWRP for HyperOS 2.0 (Android 14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: System Cleanup and Isolation
        run: |
          # Уничтожаем любые глобальные настройки Git
          sudo rm -f ~/.gitconfig
          sudo rm -f /etc/gitconfig
          rm -rf *
          
          # Задаем чистые настройки
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@build.local"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3 repo

      - name: Download Sea.zip Direct From GitHub API (Исправлено)
        run: |
          # Скачиваем sea.zip через прямую и чистую ссылку API
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o sea.zip \
            "https://githubusercontent.com{{ github.repository }}/${{ github.ref_name }}/sea.zip"
          
          # Проверяем, что файл успешно скачался
          ls -la sea.zip
          file sea.zip

      - name: Manual Clone TWRP Manifest
        run: |
          mkdir twrp
          cd twrp
          # Чистый Git скачивает минимальный манифест
          git clone --depth=1 https://github.com -b twrp-14.1 .repo/manifests
          cp -r .repo/manifests/* . || true
          
          git clone --depth=1 https://github.com -b twrp-14.1 build/make
          ln -s build/make/envsetup.sh build/envsetup.sh || cp build/make/envsetup.sh build/envsetup.sh

      - name: Unpack Device Tree
        run: |
          mkdir -p twrp/device/xiaomi/sea
          unzip sea.zip -d twrp/device/xiaomi/sea
          echo "=== Содержимое вашего дерева устройств ==="
          ls -la twrp/device/xiaomi/sea

      - name: Build TWRP Recovery (Xiaomi Sea)
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          
          lunch twrp_sea-eng || lunch lineage_sea-eng || lunch omni_sea-eng
          mka vendorbootimage -j$(nproc)

      - name: Upload TWRP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Xiaomi-Sea-VendorBoot
          path: |
            twrp/out/target/product/sea/vendor_boot.img
            twrp/out/target/product/sea/*.zip
