name: Сборка TWRP Vendor Boot Ramdisk (HyperOS 2.0 / Android 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка (Checkout) текущего репозитория
      uses: actions/checkout@v4

    - name: Максимальная очистка дискового пространства
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap: true

    - name: Установка необходимых системных пакетов (Только 64-бит)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 unzip

    - name: Создание оригинального Repo через Python (В обход curl)
      run: |
        rm -rf ~/bin
        mkdir -p ~/bin
        
        # Скачиваем чистый исходный код repo из стабильного Gerrit-репозитория Google
        python3 -c "import urllib.request; urllib.request.urlretrieve('https://googlesource.com', 'repo.b64')"
        
        # Декодируем и сохраняем оригинальный скрипт
        base64 -d repo.b64 > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        
        # Проверка работоспособности
        repo --version

    - name: Полноценная синхронизация исходников TWRP (AOSP 15)
      run: |
        mkdir twrp && cd twrp
        git config --global user.name "HyperOS-Builder"
        git config --global user.email "builder@hyperos.internal"
        
        # Инициализируем полноценный минимальный манифест для TWRP 15.0
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-15.0 --depth=1
        
        # Синхронизация (скачает только то, что необходимо для сборки рекавери)
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --depth=1

    - name: Распаковка дерева устройства из ZIP
      run: |
        VENDOR="xiaomi"
        CODENAME="sea"
        TARGET_DIR="twrp/device/${VENDOR}/${CODENAME}"
        mkdir -p $TARGET_DIR
        
        unzip -q ./sea.zip -d $TARGET_DIR
        if [ -d "$TARGET_DIR/android_device_${VENDOR}_${CODENAME}" ]; then
            mv $TARGET_DIR/android_device_${VENDOR}_${CODENAME}/* $TARGET_DIR/
            rm -rf $TARGET_DIR/android_device_${VENDOR}_${CODENAME}
        fi
        
        echo "=== Структура дерева устройства ==="
        ls -la $TARGET_DIR

    - name: Запуск компиляции vendor_boot ramdisk
      run: |
        CODENAME="sea"
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Пытаемся применить конфигурацию
        lunch twrp_${CODENAME}-eng || lunch lineage_${CODENAME}-eng
        
        # Финальный запуск компиляции образа
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового vendor_boot в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/*/*.img
