name: Build TWRP 14.1

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync Minimal Manifest
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "1144igor@gmail.com"
        # Инициализируем и качаем в текущую рабочую директорию
        repo init -u https://github.com -b twrp-14.1 --depth=1
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Unpack Device Tree (sea.zip)
      run: |
        if [ -f "sea.zip" ]; then
          echo "Архив sea.zip найден, распаковка в корень исходников..."
          unzip -o sea.zip
          rm sea.zip
        else
          echo "Ошибка: Файл sea.zip не найден в корне приватного репозитория!"
          exit 1
        fi

    - name: Build TWRP Recovery
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        # Замените 'device_name' на имя вашего устройства (каталог в device/vendor/device_name)
        lunch twrp_sea-eng
        mka vendorbootimage -j4

    - name: Upload TWRP Artifact
      uses: actions/actions-runner-share/upload-artifact@v4
      with:
        name: TWRP-Recovery
        path: out/target/product/*/vendor_boot.img
