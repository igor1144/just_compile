name: Сборка TWRP Vendor Boot Ramdisk (HyperOS 2.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Проверка (Checkout) текущего репозитория
      uses: actions/checkout@v4

    - name: Принудительное исправление DNS (на случай сбоев GitHub)
      run: |
        sudo rm -f /etc/resolv.conf
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

    - name: Установка минимальных пакетов (Только 64-бит)
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 unzip

    - name: Клонирование структуры сборщика вместо тяжелого Repo Sync
      run: |
        mkdir twrp && cd twrp
        # Скачиваем только ядро системы сборки Android 15 (минимально необходимый набор для работы компилятора)
        git clone https://github.com -b twrp-15.0 build/make --depth=1
        
        # Скачиваем сам исходный код TWRP под Android 15
        git clone https://github.com -b android-15.0 bootable/recovery --depth=1
        
        # Скачиваем базовые инструменты конфигурации
        git clone https://github.com -b twrp-15.0 build/soong --depth=1

    - name: Распаковка дерева устройства из ZIP
      run: |
        VENDOR="xiaomi"
        CODENAME="sea"
        
        TARGET_DIR="twrp/device/${VENDOR}/${CODENAME}"
        mkdir -p $TARGET_DIR
        
        # Распаковываем ваш архив sea.zip из корня
        unzip -q ./sea.zip -d $TARGET_DIR
        
        # Если внутри архива файлы лежали в подпапке, переносим их в корень TARGET_DIR
        if [ -d "$TARGET_DIR/android_device_${VENDOR}_${CODENAME}" ]; then
            mv $TARGET_DIR/android_device_${VENDOR}_${CODENAME}/* $TARGET_DIR/
            rm -rf $TARGET_DIR/android_device_${VENDOR}_${CODENAME}
        fi
        
        echo "=== Проверка наличия дерева ==="
        ls -la $TARGET_DIR

    - name: Запуск компиляции vendor_boot ramdisk
      run: |
        CODENAME="sea"
        cd twrp
        
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Определяем конфигурацию дерева
        lunch twrp_${CODENAME}-eng || lunch omni_${CODENAME}-eng
        
        # Компилируем ramdisk и упаковываем в итоговый vendor_boot.img
        make vendorbootimage -j$(nproc --all)

    - name: Загрузка готового vendor_boot в артефакты GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/*/*.img
