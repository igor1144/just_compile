name: Build TWRP for HyperOS 2.0 (Android 14)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в веб-интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-24.04 # Используем стабильную версию Ubuntu на сервере

    steps:
      - name: Checkout Workflow Code (Скачиваем ваш репозиторий с sea.zip)
        uses: actions/checkout@v4

      - name: Free Disk Space (Очистка места под исходники)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

      - name: Install Repo Tool (Надежная установка без HTML ошибок)
        run: |
          sudo apt-get update
          sudo apt-get install -y repo
          repo --version

      - name: Set Git Config
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@build.local"
          git config --global http.postBuffer 1048576000
          git config --global http.maxRequestSize 1048576000

      - name: Repo Init and Sync (Защита от варнингов и обрывов сети)
        run: |
          mkdir twrp
          cd twrp
          
          # Отключаем автоапдейт repo, чтобы убрать варнинг про "The launcher is not writable"
          export REPO_SKIP_AUTO_UPDATE=1
          
          # Инициализируем чистый репозиторий Minimal TWRP для Android 14
          repo init -u https://github.com -b twrp-14.1 --depth=1 --no-clone-bundle
          
          # Синхронизируем код. Если 4 потока падают, ставим -j1 для максимальной стабильности
          repo sync -c -j1 --fail-fast --no-clone-bundle --no-tags --force-sync

      - name: Unpack Device Tree (Распаковка вашего дерева sea.zip)
        run: |
          # Создаем целевую структуру папок для Xiaomi (устройство sea)
          mkdir -p twrp/device/xiaomi/sea
          
          # Распаковываем ваш архив sea.zip, который лежит в корне репозитория
          unzip sea.zip -d twrp/device/xiaomi/sea
          
          # Выводим структуру папок в лог, чтобы проверить правильность распаковки
          echo "=== Проверка содержимого распакованного дерева ==="
          ls -la twrp/device/xiaomi/sea

      - name: Build TWRP Recovery (Xiaomi Sea)
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          
          # Пробуем разные варианты названий конфигураций (twrp_sea, lineage_sea, omni_sea)
          lunch twrp_sea-eng || lunch lineage_sea-eng || lunch omni_sea-eng
          
          # Сборка образа vendor_boot для девайсов на HyperOS 2.0 / Android 14
          mka vendorbootimage -j$(nproc)

      - name: Upload TWRP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Xiaomi-Sea-VendorBoot
          path: |
            twrp/out/target/product/sea/vendor_boot.img
            twrp/out/target/product/sea/*.zip
