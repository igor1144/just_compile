name: Build TWRP for HyperOS 2.0 (Android 14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Workflow Code (Скачиваем ваш репозиторий с sea.zip)
        uses: actions/checkout@v4

      - name: Free Disk Space (Очистка места под исходники)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip python3

      - name: Clean and Reset Git Environment
        run: |
          rm -f ~/.gitconfig
          rm -rf ~/.repoconfig
          rm -rf twrp
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp@build.local"

      - name: Manual Clone TWRP Manifest (Обход утилиты repo)
        run: |
          mkdir twrp
          cd twrp
          # Скачиваем базовую структуру сборщика напрямую через Git
          git clone --depth=1 https://github.com -b twrp-14.1 .repo/manifests
          
          # Копируем файлы конфигурации сборки в корень рабочей папки
          cp -r .repo/manifests/* . || true
          
          # Скачиваем ключевую утилиту сборки Android (build/make) напрямую
          git clone --depth=1 https://github.com -b twrp-14.1 build/make
          ln -s build/make/envsetup.sh build/envsetup.sh || cp build/make/envsetup.sh build/envsetup.sh

      - name: Unpack Device Tree (Распаковка вашего дерева sea.zip)
        run: |
          mkdir -p twrp/device/xiaomi/sea
          unzip sea.zip -d twrp/device/xiaomi/sea
          echo "=== Проверка содержимого распакованного дерева ==="
          ls -la twrp/device/xiaomi/sea

      - name: Build TWRP Recovery (Xiaomi Sea)
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          
          # Пробуем запустить конфигурацию устройства
          lunch twrp_sea-eng || lunch lineage_sea-eng || lunch omni_sea-eng
          
          # Сборка образа vendor_boot
          mka vendorbootimage -j$(nproc)

      - name: Upload TWRP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Xiaomi-Sea-VendorBoot
          path: |
            twrp/out/target/product/sea/vendor_boot.img
            twrp/out/target/product/sea/*.zip
