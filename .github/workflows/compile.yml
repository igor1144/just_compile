name: Сборка TWRP для HyperOS 2.0

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой из браузера

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Очистка диска сервера и подготовка окружения
      uses: actions/checkout@v4

    - name: Установка необходимых пакетов для сборки Android
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagebuilder lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Установка утилиты Repo от Google
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Инициализация исходников TWRP 14.1 (AOSP 14)
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "Developer"
        git config --global user.email "1144igor@gmail.com"
        repo init --depth=1 -u https://github.com -b twrp-14.1
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Клонирование твоего дерева устройств в исходники
      run: |
        # Копируем файлы из твоего приватного репозитория в структуру папок Андроида
        mkdir -p twrp/device/xiaomi/sea
        cp -r device/xiaomi/sea/* twrp/device/xiaomi/sea/

    - name: Запуск компиляции vendor_boot
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_sea-eng
        make vendorbootimage -j4

    - name: Загрузка готового образа в GitHub Artifacts
      uses: actions/artifacts@v4
      with:
        name: TWRP-Vendor-Boot-Sea
        path: twrp/out/target/product/sea/vendor_boot.img
